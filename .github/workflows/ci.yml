# Проверки на каждую выкладку в develop и на pull request.
#
# Тестов здесь нет намеренно: половина набора (src/*-http.test.ts, сверка
# канона профилей) требует поднятой базы и фикстур платформы. Их место -- e2e
# контура, а не CI компонента. CI держит то, что проверяется без инфраструктуры:
# типы, сборку панели и сборку образа.

name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  ux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ux/package-lock.json
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t placitum/controller:ci .
